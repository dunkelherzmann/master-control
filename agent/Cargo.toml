[package]
name = "mc-agent"
description = "Master Control agent: runs on the machine under test and serves the HTTP API and MCP"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
object = { version = "0.41.0", default-features = false, features = ["read", "std"] }
rustc-demangle = "0.1.28"
base64 = "0.23.1"
getrandom = "0.2"
mc-core = { path = "../core" }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = "2"

[dev-dependencies]
base64 = "0.23.1"
ureq = "2"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
framehop = "0.16.0"
x11rb = { version = "0.14.0", features = ["xtest"] }
zbus = { version = "5", features = ["blocking-api"] }

[target."cfg(windows)".dependencies]
pdb = "0.8.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_Time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
