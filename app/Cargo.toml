[package]
name = "master-control"
description = "Master Control: one program that is the window, the master and the worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mc-agent = { path = "../agent" }
mc-core = { path = "../core" }
mctl = { path = "../mctl" }
fontdue = "0.9.5"
png = "0.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Console", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
